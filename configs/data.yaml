# Data loading and preprocessing configuration
# NOTE (data audit 2026-11-04, docs/data_audit.md): the ESA HREDA investigation below has
# NO downloadable data (data_available=False). Without raw files in data/raw/esa the ESA
# loader returns a SYNTHETIC stand-in. Real fluid-shift values = published group means in
# data/external/literature_aggregates.csv.
dataset:
  name: "esa_headward_fluid_shift"
  doi: "10.57780/esa-0ggni9p"
  investigation_acronym: "HeadwardFluidShift_PARA"
  campaign: "82nd ESA/NASA Parabolic Flight Campaign (June 2023) - results under evaluation, no files"
  # Lee 2020 is an EARLIER campaign (ISLSWG, June 2018, no 0-G parabolas), not PFC82
  reference_study: "Lee et al., Frontiers in Physiology 2020 (DOI: 10.3389/fphys.2020.00863)"
  n_subjects: 9
  gravity_levels: [1.0, 0.75, 0.50, 0.25, 0.0]
  postures: ["seated", "supine"]
  paths:
    raw_esa_dir: "data/raw/esa"
    processed_dir: "data/processed"
    synthetic_dir: "data/synthetic"
    rppg_dir: "data/raw/rppg"
    external_dir: "data/external"
    interim_dir: "data/interim"

# Real datasets (see src/vascushift/data/registry.py; download: scripts/download_data.py)
real_datasets:
  ubfc_rppg:
    path: "data/raw/rppg/UBFC-rPPG"
    subsets: ["DATASET_2", "DATASET_1"]
    rgb_cache: "data/interim/ubfc_rgb"
    no_face_display: ["DATASET_2/subject21", "DATASET_2/subject27"]
  physionet_prcp:
    path: "data/raw/physionet/prcp/1.0.0"
  physionet_cardioresp_orthostat:
    path: "data/raw/physionet/cardioresp-response-orthostat/1.0"
  physionet_videopulse:
    path: "data/raw/physionet/videopulse/1.0.0"
  literature_aggregates:
    path: "data/external/literature_aggregates.csv"
  hreda_snapshot:
    path: "data/external/hreda/hreda_snapshot.json"

synthetic:
  enabled: true
  n_subjects: 30
  noise_sigma: 0.05
  gravity_grid: [0.0, 0.16, 0.25, 0.38, 0.50, 0.75, 1.0]
  seed: 42

