# Physiological parameters and compartment definitions
physiology:
  fluid_density_kg_m3: 1060.0        # Blood density rho (kg/m3)
  gravity_earth_m_s2: 9.80665        # Standard gravity g0 (m/s2)
  conversion_pa_to_mmhg: 0.00750062  # 1 Pa in mmHg
  delta_h_heart_neck_m: 0.35         # Hydrostatic vertical distance from RA to mid-cervical IJV (m)

compartments:
  cephalic:
    name: "Internal Jugular Vein (IJV)"
    min_area_mm2: 5.0
    nominal_seated_area_mm2: 12.0
    nominal_supine_area_mm2: 108.0
    max_area_mm2: 180.0
    external_pressure_mmhg: 0.0      # Atmospheric/tissue reference
  central:
    name: "Right Atrial / Thoracic Reservoir"
    nominal_cvp_mmhg: 5.0            # Central venous pressure in mmHg
    cvp_range_mmhg: [2.0, 10.0]

vein_compliance:
  model_type: "sigmoidal"            # Sigmoidal collapsible tube model
  k_slope: 0.25                      # Slope of collapse/distension transition (1/mmHg)
  p0_transition_mmhg: 3.0            # Pressure at 50% max compliance (mmHg)

