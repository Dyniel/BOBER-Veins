# Physics-Informed Neural Network (PINN) and Mechanistic Model Configuration
model:
  name: "vascushift_pinn"
  input_dim: 2                       # [gravity_z, subject_indicator_or_height]
  hidden_dims: [32, 32]
  output_dim: 2                      # [predicted_area_mm2, predicted_pressure_mmhg]
  activation: "tanh"

training:
  epochs: 1000
  learning_rate: 0.005
  weight_decay: 0.0001
  loss_weights:
    lambda_data: 1.0                 # Weight for observed data fitting
    lambda_physics: 1.0              # Weight for mechanistic hydrostatic + compliance residual
    lambda_constraints: 2.0          # Weight for physical non-negativity and bounds
  scheduler:
    type: "step"
    step_size: 300
    gamma: 0.5
  seed: 42

mechanistic_baseline:
  optimizer: "L-BFGS-B"
  max_iter: 500
  bounds:
    A0: [30.0, 160.0]
    k: [0.05, 0.8]
    P0: [-5.0, 15.0]
    CVP: [1.0, 15.0]

